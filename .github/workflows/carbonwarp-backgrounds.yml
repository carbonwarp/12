name: carbonwarp-backgrounds

on:
  push:
    tags:
      - "carbonwarp-backgrounds-v*" # trigger on tag push
      
concurrency:
  group: carbonwarp-backgrounds-${{ github.ref }}
  # never cancel a running release
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NFPM_VERSION: "2.47.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb
          
      - name: Write signing key
        env:
          PRIVATE_ASC: ${{ secrets.PRIVATE_ASC }}
        run: |
          test -n "$PRIVATE_ASC" || { echo "secret PRIVATE_ASC is not set"; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_ASC" > private.asc

      - name: Build
        env:
          NFPM_PASSPHRASE: ${{ secrets.NFPM_PASSPHRASE }} 
        run: just -f carbonwarp-backgrounds.just

      - name: Remove signing key
        if: always()
        run: rm -f private.asc

      - name: Check output
        run: ls -l carbonwarp-backgrounds/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: carbonwarp-backgrounds-dist
          path: carbonwarp-backgrounds/dist/*

      # ---- release (tags only) ----
      - name: Versioned release (carbonwarp-backgrounds-vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/carbonwarp-backgrounds-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" carbonwarp-backgrounds/dist/* \
            --title "carbonwarp-backgrounds ${GITHUB_REF_NAME#carbonwarp-backgrounds-v}" \
            --latest=false

      - name: Rolling release (carbonwarp-backgrounds-latest)
        if: startsWith(github.ref, 'refs/tags/carbonwarp-backgrounds-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete carbonwarp-backgrounds-latest --cleanup-tag --yes || true
          gh release create carbonwarp-backgrounds-latest carbonwarp-backgrounds/dist/* \
            --target "$GITHUB_SHA" \
            --title "carbonwarp-background (latest: ${GITHUB_REF_NAME#carbonwarp-backgrounds-v})" \
            --latest=false
