name: filee

on:
  # Check build: only when filee's own files change
  pull_request:
    paths:
      - "filee.just"
      - "filee.nfpm*"
      - "filee/**"
      - ".github/workflows/filee.yml"
  push:
    branches: [main]
    paths:
      - "filee.just"
      - "filee.nfpm*"
      - "filee/**"
      - ".github/workflows/filee.yml"
    # Release: tag like filee-v1.1.1 (path filters are not applied to tags)
    tags: ["filee-v*"]
  workflow_dispatch:

concurrency:
  group: filee-${{ github.ref }}
  # never cancel a running release
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NFPM_VERSION: "2.47.0"
  BUILD_RECIPE: "package_all"   # recipe in filee.just

jobs:
  build:
    # fork PRs have no access to the signing secret
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb

      - name: Check tag matches nfpm version
        if: startsWith(github.ref, 'refs/tags/filee-v')
        run: |
          want="${GITHUB_REF_NAME#filee-v}"
          have="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?.*/\1/p' filee.nfpm | head -1)"
          [ "$want" = "$have" ] || { echo "tag version $want != filee.nfpm version $have"; exit 1; }

      - name: Read upstream version (filee.just)
        run: |
          up="$(sed -nE 's/^version[[:space:]]*:=[[:space:]]*"([^"]+)".*/\1/p' filee.just | head -1)"
          echo "UPSTREAM_VERSION=$up" >> "$GITHUB_ENV"

      - name: Write signing key
        env:
          PRIVATE_ASC: ${{ secrets.PRIVATE_ASC }}
        run: |
          test -n "$PRIVATE_ASC" || { echo "secret PRIVATE_ASC is not set"; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_ASC" > private.asc

      - name: Build
        env:
          NFPM_PASSPHRASE: ${{ secrets.NFPM_PASSPHRASE }}   # leave the secret unset if the key has no passphrase
        run: just -f filee.just "$BUILD_RECIPE"

      - name: Remove signing key
        if: always()
        run: rm -f private.asc

      - name: Check output
        run: ls -l filee/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: filee-dist
          path: filee/dist/*

      # ---- release (tags only) ----
      - name: Versioned release (filee-vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/filee-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" filee/dist/* \
            --title "Filee ${GITHUB_REF_NAME#filee-v}" \
            --notes "Package version ${GITHUB_REF_NAME#filee-v}, built from upstream Filee ${UPSTREAM_VERSION}." \
            --latest=false

      - name: Rolling release (filee-latest)
        if: startsWith(github.ref, 'refs/tags/filee-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete filee-latest --cleanup-tag --yes || true
          gh release create filee-latest filee/dist/* \
            --target "$GITHUB_SHA" \
            --title "Filee (latest: ${GITHUB_REF_NAME#filee-v})" \
            --notes "Rolling pointer to ${GITHUB_REF_NAME} (upstream Filee ${UPSTREAM_VERSION})." \
            --latest=false
