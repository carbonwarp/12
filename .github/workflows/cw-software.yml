name: cw-software

on:
  push:
    tags:
      - "cw-software-v*" # trigger on tag push
      
concurrency:
  group: cw-software-${{ github.ref }}
  # never cancel a running release
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NFPM_VERSION: "2.47.0"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v3

      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb


      - name: Build
        env:
          NFPM_PASSPHRASE: ${{ secrets.NFPM_PASSPHRASE }} 
        run: just -f cw-software.just

      - name: Remove signing key
        if: always()
        run: rm -f private.asc

      - name: Check output
        run: ls -l cw-software/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cw-software-dist
          path: cw-software/dist/*

      # ---- release (tags only) ----
      - name: Versioned release (cw-software-vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/cw-software-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cw-software/dist/* \
            --title "CWSoftware ${GITHUB_REF_NAME#cw-software-v}" \
            --latest=false

      - name: Rolling release (cw-software-latest)
        if: startsWith(github.ref, 'refs/tags/cw-software-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cw-software-latest --cleanup-tag --yes || true
          gh release create cw-software-latest cw-software/dist/* \
            --target "$GITHUB_SHA" \
            --title "CWSoftware (latest: ${GITHUB_REF_NAME#cw-software-v})" \
            --latest=false
